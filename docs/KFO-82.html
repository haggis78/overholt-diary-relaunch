            <h1></h1> <span class="pagenum">82</span>
            
            
            <p>After <span class="persName">Gf O’s</span> death, <span class="persName">Gdm</span> had <span class="persName">Mother</span> change her room from 3rd floor N.E. to 2nd floor North adjoining her.
               Sarah Fox- sister in law of Jacob S.O., also came to live there a while. 
               </p>
            
            <p><span class="persName">C.S.R.O</span> was night man at will.
               </p>
