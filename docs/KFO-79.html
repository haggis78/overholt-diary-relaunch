            <h1></h1> <span class="pagenum">79</span>
            
            
            <p>In August- after a few days in the <span class="abbr"><span class="placeName">Mt P</span></span> store of O&amp;S- he went to <span class="placeName">Broadford</span> &amp; started work there 
               In <span class="date">October, 10th, 1868</span> he joined the Baptist church in <span class="abbr"><span class="placeName">Mt P</span></span> by letter from the first Baptist Church of <span class="abbr"><span class="placeName">Pgh</span></span>.
               </p>
