            <h1></h1> <span class="pagenum">85</span>
            
            
            <p><span class="persName">Gf.F</span>, aged 25 ½ years,</p>
            
            <p>&amp;</p>
            
            <p><span class="persName">Gm F.</span>, aged 28 ⅓ years,</p>
            
            <p>Married</p>  
            
            <p><span class="date">Oct 19, 1847</span>.</p>
            
            <p><span class="persName">Gf.F</span> employed by <span class="persName">A.O</span> prior, in the mill at <span class="placeName">West Overton</span>. They lived with <span class="persName">A.O</span> &amp; <span class="persName">M.O</span>until spring of <span class="date">1852</span></p>.
